<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Camarero Express</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Camarero Express</h1>
  <div class="top-actions">
    <button id="langBtn" class="pill" data-i18n-title="Язык тренировки">ES</button>
    <button id="settingsBtn" class="icon-btn" data-i18n-title="Настройки">⚙</button>
  </div>
</header>

<main id="view" aria-live="polite">
  <p class="muted center" data-i18n="Загружаю…">Загружаю…</p>
</main>

<nav class="tabs" role="tablist">
  <button data-tab="plan" role="tab"><span>📅</span><b data-i18n="План">План</b></button>
  <button data-tab="cards" role="tab"><span>🃏</span><b data-i18n="Карточки">Карточки</b></button>
  <button data-tab="speak" role="tab"><span>🎤</span><b data-i18n="Вслух">Вслух</b></button>
  <button data-tab="scenes" role="tab"><span>🎭</span><b data-i18n="Сцены">Сцены</b></button>
  <button data-tab="quiz" role="tab"><span>❓</span><b data-i18n="Квиз">Квиз</b></button>
</nav>

<dialog id="settings">
  <form method="dialog" class="settings">
    <h2 data-i18n="Настройки">Настройки</h2>
    <label><span>🌐 <span data-i18n="Язык приложения">Язык приложения</span></span>
      <select id="promptLang">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </label>
    <p class="muted small" style="margin-top:-8px" data-i18n="Интерфейс, подсказки, комментарии и объяснения. На каком языке отвечаешь — переключатель ES / EN вверху.">…</p>
    <label class="check-row"><input type="checkbox" id="aiCheck"> <span data-i18n="Автопроверка ответов (AI)">Автопроверка ответов (AI)</span></label>
    <p class="muted small" style="margin-top:-8px" data-i18n="Если сказанное не совпало с эталоном дословно, AI решает, правильно ли это и естественно ли. Около $0,001 за проверку.">…</p>
    <label><span data-i18n="Скорость озвучки">Скорость озвучки</span>
      <input type="range" id="rate" min="0.6" max="1.2" step="0.05">
      <output id="rateOut"></output>
    </label>
    <label><span data-i18n="Голос ES">Голос ES</span> <select id="voiceEs"></select></label>
    <label><span data-i18n="Голос EN">Голос EN</span> <select id="voiceEn"></select></label>
    <label><span data-i18n="Новых карточек за сессию">Новых карточек за сессию</span>
      <input type="number" id="newPerSession" min="5" max="60" step="5">
    </label>
    <p class="muted small" data-i18n="Прогресс хранится только в этом браузере.">…</p>
    <div class="row">
      <button type="button" id="exportBtn" class="btn ghost" data-i18n="Экспорт прогресса">Экспорт прогресса</button>
      <button type="button" id="resetBtn" class="btn danger" data-i18n="Сбросить всё">Сбросить всё</button>
    </div>
    <button class="btn primary wide" data-i18n="Готово">Готово</button>
  </form>
</dialog>

<button id="reportBtn" class="fab" data-i18n-title="Пожаловаться">✋</button>

<dialog id="report">
  <form method="dialog" class="settings" id="reportForm">
    <h2 data-i18n="✋ Что не так?">✋ Что не так?</h2>
    <div class="note small" id="reportCtx"></div>
    <div class="chips" id="reportTags">
      <button type="button" class="chip" data-tag="испанский" data-i18n="Ошибка в испанском">Ошибка в испанском</button>
      <button type="button" class="chip" data-tag="неестественно" data-i18n="Так не говорят">Так не говорят</button>
      <button type="button" class="chip" data-tag="факт" data-i18n="Неверный факт">Неверный факт</button>
      <button type="button" class="chip" data-tag="перевод" data-i18n="Перевод / подсказка">Перевод / подсказка</button>
      <button type="button" class="chip" data-tag="распознавание" data-i18n="Не распознало">Не распознало</button>
      <button type="button" class="chip" data-tag="оценка" data-i18n="Оценка нечестная">Оценка нечестная</button>
      <button type="button" class="chip" data-tag="баг" data-i18n="Баг приложения">Баг приложения</button>
      <button type="button" class="chip" data-tag="идея" data-i18n="Идея">Идея</button>
    </div>
    <textarea id="reportText" rows="4" data-i18n-ph="Своими словами: что не так или как надо…"></textarea>
    <div class="row">
      <button type="button" class="btn ghost" id="reportCancel" data-i18n="Отмена">Отмена</button>
      <button type="button" class="btn primary" id="reportSend" data-i18n="Отправить">Отправить</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
